[package]
name = "mushak-uiaccess-helper"
version = "0.0.2"
edition = "2021"
description = "Wheel-only UIAccess input broker for Mushak"
license = "MIT"
rust-version = "1.77"
publish = false

[[bin]]
name = "mushak-uiaccess-helper"
path = "src/main.rs"
test = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
winresource = "0.1"
