<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mushak mouse controls review</title><style>
:root{color-scheme:dark}body{max-width:1800px;margin:24px auto;padding:0 20px;background:#161b21;color:#f3f2ee;font:15px system-ui}h1{font-size:26px}h2{font-size:18px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;color:#c5cbd1}select,button{font:inherit;color:inherit;background:#282f38;border:1px solid #58616d;border-radius:5px;padding:7px}a{color:#ffbd62}section{display:grid;align-items:start;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}figure img{width:100%;height:auto;display:block}figcaption{margin:14px 0 6px}#missingL,#missingR{color:#b9c2cf}#strip{display:flex;gap:12px;flex-wrap:wrap}#strip a{width:min(220px,100%)}#strip img{width:100%;height:auto}footer{margin:22px 0}@media(max-width:760px){section{grid-template-columns:1fr}body{padding:0 8px}}</style>
<h1>Mouse controls review</h1><nav><label>Before<select id="left"></select></label><label>After<select id="right"></select></label><label>Theme<select id="theme"><option>Dark</option><option>Light</option></select></label><label>Interaction<select id="frame"></select></label></nav><section><figure><figcaption id="titleL"></figcaption><a id="linkL"><img id="imageL" alt=""></a><p id="missingL"></p></figure><figure><figcaption id="titleR"></figcaption><a id="linkR"><img id="imageR" alt=""></a><p id="missingR"></p></figure></section>
<h2>Shortcut editor in a separate Windows process</h2><div id="strip"></div><footer><a href="README.md">Report</a> · <a href="scores.csv">Reviewer scores and comments</a> · <a href="medians.json">Group medians</a></footer>
<script>
const left=document.getElementById("left"),right=document.getElementById("right"),frame=document.getElementById("frame"),theme=document.getElementById("theme"),strip=document.getElementById("strip");
const stages=["baseline",...Array.from({length:30},(_,i)=>"round-"+String(i+1).padStart(2,"0"))];
const frames={A1:"Diagram and assignments",A2:"Profile chooser",A3:"Compact assignments",A5:"Compact profile chooser",A4:"Disconnected",B1:"Scrolling",B2:"Wheel mode draft",B5:"Switch controls with unsaved edits",B3:"Middle click",B4:"Resize wheel editor",C1:"Button actions",C2:"Search for Copy",C6:"Select Copy",C3:"Recorded K",C5:"Modifier selected",C4:"Resize shortcut editor",D1:"Wheel mode button",D2:"Choose pointer speeds",D3:"Mouse with 32 DPI steps"};
const first={A5:27,B5:25,C5:26,C6:30,D3:28};
for(const id of ["left","right"]){for(const stage of stages)document.getElementById(id).add(new Option(stage,stage));}
right.value="round-30";for(const [k,v] of Object.entries(frames))frame.add(new Option(v,k));frame.value="B4";
function draw(side,stage){const id=frame.value;const available=stages.indexOf(stage)>=(first[id]||0);const url=stage+"/"+theme.value+"/"+id+".webp";const img=document.getElementById("image"+side);const a=document.getElementById("link"+side);img.hidden=!available;img.style.display=available?"block":"none";document.getElementById("title"+side).textContent=stage+" · "+frames[id];if(available){a.href=url;img.src=url;img.alt=theme.value+" "+frames[id]+" in "+stage;}else{a.removeAttribute("href");img.removeAttribute("src");}document.getElementById("missing"+side).textContent=available?"":"First captured in "+stages[first[id]]+"."}
function show(){draw("L",left.value);draw("R",right.value)}document.querySelector("nav").onchange=show;show();
const sequence=[["05-0-shortcut","Shortcut 1"],["06-0-actions","Actions 1"],["05-1-shortcut","Shortcut 2"],["06-1-actions","Actions 2"],["05-2-shortcut","Shortcut 3"],["06-2-actions","Actions 3"],["07-recorded-M","Record M"],["08-resized","Resize and cancel"],["08b-save-K","Save K"],["10-reopened-back","Restart and reopen"]];for(const [name,title] of sequence){let a=document.createElement("a"),i=document.createElement("img");a.href="native/"+name+".webp";i.src=a.href;i.alt=title;a.append(i,document.createTextNode(title));strip.append(a);}
</script></html>
